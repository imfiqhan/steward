version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks: ["all", "-ST1000"]
  exclusions:
    rules:
      # hasManyForm[T,C] is only ever called through the generic
      # nestedForm[T] interface (form_render.go, resource.go); staticcheck's
      # unused pass cannot trace method usage through generic interface
      # dispatch and flags the whole implementation.
      - path: form_nested\.go
        linters: [unused]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
