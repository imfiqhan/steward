<!doctype html>
<html lang="en" class="{{if eq .Page.Theme "dark"}}dark{{end}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>{{.Page.Title}} — {{.Page.Brand}}</title>
  <meta name="csrf-token" content="{{.Page.CSRF}}"/>
  <link rel="stylesheet" href="{{asset "dist/app.css"}}"/>
</head>
<body>
  {{template "layout/sidebar.html" .}}
  <main class="min-h-screen flex flex-col">
    {{template "layout/header.html" .}}
    <div id="page-content" class="flex-1">
      {{template "layout/flash.html" .}}
      {{.Data.Content}}
    </div>
    <footer class="border-t px-6 py-3 text-center text-xs text-muted-foreground">
      Powered by Steward
    </footer>
  </main>
  <div id="toaster" class="toaster"></div>
  <script src="{{asset "dist/app.js"}}" defer></script>
</body>
</html>
