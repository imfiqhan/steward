<aside id="sidebar" class="sidebar" data-side="left">
  <nav id="sidebar-menu" aria-label="Sidebar navigation">
    <header>
      <a href="{{.Page.Prefix}}/" class="flex items-center gap-2 px-2 py-1.5 font-semibold text-lg">
        {{.Page.Brand}}
      </a>
    </header>
    <section class="scrollbar-sm">
      {{range .Page.Menu}}
        {{if .Children}}
        <div role="group" aria-labelledby="menu-group-{{.Title}}">
          <h3 id="menu-group-{{.Title}}">{{.Title}}</h3>
          <ul>
            {{range .Children}}
            <li>
              <a href="{{.URI}}" {{if .Active}}aria-current="page"{{end}}
                 hx-get="{{.URI}}" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML show:window:top">
                {{if .Icon}}{{icon .Icon}}{{end}}
                <span>{{.Title}}</span>
              </a>
            </li>
            {{end}}
          </ul>
        </div>
        {{else}}
        <div role="group">
          <ul>
            <li>
              <a href="{{.URI}}" {{if .Active}}aria-current="page"{{end}}
                 hx-get="{{.URI}}" hx-target="#page-content" hx-push-url="true" hx-swap="innerHTML show:window:top">
                {{if .Icon}}{{icon .Icon}}{{end}}
                <span>{{.Title}}</span>
              </a>
            </li>
          </ul>
        </div>
        {{end}}
      {{end}}
    </section>
  </nav>
</aside>
