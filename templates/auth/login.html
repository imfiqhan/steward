<!doctype html>
<html lang="en" class="{{if eq .Page.Theme "dark"}}dark{{end}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Sign in — {{.Page.Brand}}</title>
  <link rel="stylesheet" href="{{asset "dist/app.css"}}"/>
</head>
<body>
  <div class="min-h-screen grid place-items-center p-4">
    <div class="w-full max-w-sm grid gap-6">
      <h1 class="text-center text-2xl font-semibold">{{.Page.Brand}}</h1>
      <div class="card">
        <header>
          <h2>Sign in to your account</h2>
          <p>Enter your username and password below.</p>
        </header>
        <section>
          {{if .Data.Error}}
          <div class="alert mb-4" data-variant="destructive">
            <h2>{{.Data.Error}}</h2>
          </div>
          {{end}}
          <form action="{{url "auth/login"}}" method="post" autocomplete="off" novalidate class="grid gap-6">
            <input type="hidden" name="_token" value="{{.Page.CSRF}}"/>
            <div class="grid gap-2">
              <label class="label" for="login-username">Username</label>
              <input class="input" id="login-username" name="username" type="text" placeholder="Your username"
                     value="{{.Data.Username}}" autocomplete="username" autofocus required/>
            </div>
            <div class="grid gap-2">
              <div class="flex items-center">
                <label class="label" for="login-password">Password</label>
                {{if .Data.CanReset}}
                <a href="{{url "auth/forgot"}}" class="ms-auto inline-block text-sm underline-offset-4 hover:underline">Forgot password?</a>
                {{end}}
              </div>
              <input class="input" id="login-password" name="password" type="password"
                     autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn w-full">Sign in</button>
          </form>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
