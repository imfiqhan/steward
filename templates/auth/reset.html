<!doctype html>
<html lang="en" class="{{if eq .Page.Theme "dark"}}dark{{end}}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Reset password — {{.Page.Brand}}</title>
  <link rel="stylesheet" href="{{asset "dist/app.css"}}"/>
</head>
<body>
  <div class="min-h-screen grid place-items-center p-4">
    <div class="w-full max-w-sm">
      <div class="card">
        <header>
          <h2>Choose a new password</h2>
        </header>
        <section>
          {{if .Data.Invalid}}
          <div class="alert" data-variant="destructive">
            <h2>This reset link is invalid or has expired.</h2>
          </div>
          <p class="mt-4 text-center text-sm"><a class="underline-offset-4 hover:underline" href="{{url "auth/forgot"}}">Request new link</a></p>
          {{else}}
          {{with .Data.Error}}
          <div class="alert mb-4" data-variant="destructive"><h2>{{.}}</h2></div>
          {{end}}
          <form action="{{url "auth/reset"}}" method="post" novalidate class="grid gap-6">
            <input type="hidden" name="_token" value="{{.Page.CSRF}}"/>
            <input type="hidden" name="token" value="{{.Data.Token}}"/>
            <div class="grid gap-2">
              <label class="label" for="reset-password">New password</label>
              <input class="input" id="reset-password" name="password" type="password" autocomplete="new-password" autofocus required/>
            </div>
            <div class="grid gap-2">
              <label class="label" for="reset-confirm">Confirm password</label>
              <input class="input" id="reset-confirm" name="password_confirmation" type="password" autocomplete="new-password" required/>
            </div>
            <button type="submit" class="btn w-full">Reset password</button>
          </form>
          {{end}}
        </section>
      </div>
    </div>
  </div>
</body>
</html>
