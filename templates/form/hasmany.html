{{define "form/_nestedrow"}}
<div class="rounded-lg border p-4 steward-nested-row" data-steward-nested-row data-key="{{.Key}}">
  <div class="flex items-start gap-3">
    <div class="grid grow gap-4 sm:grid-cols-2">
      {{range .Fields}}
        {{template "form/field.html" .}}
      {{end}}
    </div>
    <button type="button" class="btn shrink-0" data-variant="ghost" data-size="icon-sm"
            data-steward-nested-remove aria-label="Remove row">
      <span class="text-destructive">{{icon "trash"}}</span>
    </button>
  </div>
</div>
{{end}}
<fieldset class="fieldset" data-steward-nested="{{.Name}}">
  <legend>{{.Label}}</legend>
  <div class="grid gap-3" data-steward-nested-rows>
    {{range .Rows}}{{template "form/_nestedrow" .}}{{end}}
  </div>
  <template data-steward-nested-template>
    {{template "form/_nestedrow" .Template}}
  </template>
  <div>
    <button type="button" class="btn" data-variant="outline" data-size="sm" data-steward-nested-add>
      {{icon "plus"}} Add {{.Label}}
    </button>
  </div>
</fieldset>
