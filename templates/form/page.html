<div class="p-6 grid grid-cols-1 gap-6 max-w-3xl">
  <div>
    <p class="text-sm text-muted-foreground">{{if .Data.Creating}}Create{{else}}Edit{{end}}</p>
    <h2 class="text-2xl font-semibold">{{if .Data.Creating}}New {{end}}{{.Data.Title}}</h2>
  </div>
  <form class="card" data-steward-form action="{{.Data.Action}}" data-method="{{.Data.Method}}" method="post" novalidate>
    <section class="grid gap-6">
      {{range .Data.Fields}}
        {{template "form/field.html" .}}
      {{end}}
      {{range .Data.Nested}}
        {{template "form/hasmany.html" .}}
      {{end}}
    </section>
    <footer class="flex items-center">
      <a class="btn" data-variant="ghost" href="{{.Data.CancelURL}}"
         hx-get="{{.Data.CancelURL}}" hx-target="#page-content" hx-push-url="true">Cancel</a>
      <button type="submit" class="btn ms-auto" data-steward-submit>
        {{if .Data.Creating}}Create{{else}}Save changes{{end}}
      </button>
    </footer>
  </form>
</div>
