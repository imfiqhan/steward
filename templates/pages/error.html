<div class="page-body">
  <div class="container-xl d-flex flex-column justify-content-center">
    <div class="empty">
      <div class="empty-header">{{.Data.Code}}</div>
      <p class="empty-title">{{.Data.Title}}</p>
      {{if .Data.Detail}}<p class="empty-subtitle text-secondary">{{.Data.Detail}}</p>{{end}}
      <div class="empty-action">
        <a href="{{.Page.Prefix}}/" class="btn btn-primary"
           hx-get="{{.Page.Prefix}}/" hx-target="#page-content" hx-push-url="true">
          {{icon "chevron-left"}} Back to dashboard
        </a>
      </div>
    </div>
  </div>
</div>
