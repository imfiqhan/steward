<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <div class="page-pretitle">System</div>
        <h2 class="page-title">Scheduler</h2>
      </div>
    </div>
  </div>
</div>
<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="table-responsive">
        <table class="table table-vcenter card-table">
          <thead><tr><th>Job</th><th>Schedule</th><th>Last run</th><th>Last error</th></tr></thead>
          <tbody>
            {{if not .Data.Jobs}}
            <tr><td colspan="4" class="text-secondary">No jobs registered.</td></tr>
            {{end}}
            {{range .Data.Jobs}}
            <tr>
              <td>{{.Name}}</td>
              <td><code>{{.Spec}}</code></td>
              <td>{{if .LastRun.IsZero}}<span class="text-secondary">never</span>{{else}}{{.LastRun.Format "2006-01-02 15:04:05"}}{{end}}</td>
              <td>{{if .LastErr}}<span class="text-danger">{{.LastErr}}</span>{{else}}<span class="status status-green">OK</span>{{end}}</td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
