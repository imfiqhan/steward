<div class="p-6 grid grid-cols-1 gap-4">
  <h2 class="text-2xl font-semibold">{{.Data.Title}}</h2>
  <div class="card">
    <section>
      <div class="grid place-items-center gap-2 py-12 text-center">
        {{icon "table"}}
        <p class="font-medium">{{t "The %v grid is on its way" .Data.Title}}</p>
        <p class="text-sm text-muted-foreground">
          {{t "This resource is registered as"}} <span class="kbd">{{.Data.Slug}}</span>.
        </p>
      </div>
    </section>
  </div>
</div>
