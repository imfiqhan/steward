<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title">{{.Data.Title}}</h2>
      </div>
    </div>
  </div>
</div>
<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="empty">
        <div class="empty-icon">{{icon "table" "icon-lg"}}</div>
        <p class="empty-title">The {{.Data.Title}} grid is on its way</p>
        <p class="empty-subtitle text-secondary">
          This resource is registered as <code>{{.Data.Slug}}</code>. Its grid, form, and
          detail views are generated once the Grid builder milestone lands.
        </p>
      </div>
    </div>
  </div>
</div>
